<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ef394e" />
    <title>آفلاین — جاب‌آزمون</title>
    <link rel="icon" href="/icons/icon-192.png" type="image/png" />
    <style>
      :root {
        --brand: #ef394e;
        --bg: #f5f5f5;
        --ink: #1e293b;
        --muted: #64748b;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background:
          radial-gradient(circle at top right, rgba(239, 57, 78, 0.12), transparent 40%),
          radial-gradient(circle at bottom left, rgba(15, 39, 68, 0.08), transparent 45%),
          var(--bg);
        color: var(--ink);
        font-family: Vazirmatn, Tahoma, system-ui, sans-serif;
      }
      .card {
        width: min(100%, 26rem);
        text-align: center;
        padding: 2rem 1.5rem;
        border-radius: 1.25rem;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 18px 40px rgba(15, 23, 42, 0.08);
        border: 1px solid rgba(148, 163, 184, 0.25);
      }
      .icon {
        width: 5rem;
        height: 5rem;
        margin: 0 auto 1rem;
        display: block;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.5rem;
        font-weight: 800;
      }
      p {
        margin: 0 0 1.5rem;
        color: var(--muted);
        line-height: 1.8;
        font-size: 0.95rem;
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 0.75rem;
        padding: 0.8rem 1.75rem;
        background: var(--brand);
        color: #fff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      button:hover {
        filter: brightness(0.95);
      }
      .hint {
        margin-top: 1rem;
        font-size: 0.8rem;
        color: #94a3b8;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img class="icon" src="/offline.svg" alt="" width="80" height="80" />
      <h1>شما آفلاین هستید</h1>
      <p>
        اتصال اینترنت در دسترس نیست. اگر قبلاً آزمون‌ها را دیده باشید، ممکن است
        برخی محتوا از حافظهٔ دستگاه قابل مشاهده باشد.
      </p>
      <button type="button" onclick="location.reload()">تلاش مجدد</button>
      <p class="hint">جاب‌آزمون — آمادگی آزمون‌های استخدامی</p>
    </main>
  </body>
</html>
