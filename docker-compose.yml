version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jobazmoon-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - jobazmoon-network
    depends_on:
      - db
      - redis
    healthcheck:
      # PHP-FPM خودش HTTP سرو نمی‌کند؛ از طریق nginx در شبکه داخلی چک می‌شود.
      # ok و degraded هر دو برای load balancer سالم‌اند؛ فقط down شکست می‌خورد.
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://nginx/health | grep -Eq '\"status\"[[:space:]]*:[[:space:]]*\"(ok|degraded)\"'",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  nginx:
    image: nginx:alpine
    container_name: jobazmoon-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - jobazmoon-network
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: jobazmoon-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: jobazmoon
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_PASSWORD: secret
      MYSQL_USER: jobazmoon
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - jobazmoon-network

  redis:
    image: redis:alpine
    container_name: jobazmoon-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - jobazmoon-network

  node:
    image: node:20-alpine
    container_name: jobazmoon-node
    working_dir: /var/www
    volumes:
      - ./:/var/www
    command: sh -c "npm install && npm run build"
    networks:
      - jobazmoon-network

networks:
  jobazmoon-network:
    driver: bridge

volumes:
  dbdata:
