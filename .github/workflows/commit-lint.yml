name: Commit Lint

on:
  push:
  pull_request:

jobs:
  commitlint:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commit messages
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          PATTERN='^(feat|fix|docs|style|refactor|test|chore|perf|security|ci|build|revert)(\([^)]+\))?: .{1,100}$'

          if [ "$EVENT_NAME" = "pull_request" ]; then
            RANGE="${PR_BASE}..${PR_HEAD}"
          else
            if [ -z "${BEFORE:-}" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              RANGE="-1"
            else
              RANGE="${BEFORE}..HEAD"
            fi
          fi

          if [ "$RANGE" = "-1" ]; then
            MSGS="$(git log -1 --format=%s)"
          else
            MSGS="$(git log --format=%s "$RANGE")"
          fi

          FAIL=0
          while IFS= read -r msg; do
            [ -z "$msg" ] && continue
            # Allow git-generated merge/revert subjects
            if [[ "$msg" =~ ^Merge\  ]] || [[ "$msg" =~ ^Revert\  ]]; then
              echo "ℹ️  skip: $msg"
              continue
            fi
            if ! echo "$msg" | grep -qE "$PATTERN"; then
              echo "❌ Invalid commit message: $msg"
              FAIL=1
            else
              echo "✅ $msg"
            fi
          done <<< "$MSGS"

          if [ "$FAIL" -ne 0 ]; then
            echo ""
            echo "Use Conventional Commits: type(scope): description"
            echo "Or run: ./scripts/commit.sh"
            exit 1
          fi

          echo "✅ All commit messages valid."
