name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: PHP / Laravel
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: jobazmoon_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_mysql, gd, exif, bcmath, zip
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          # CI defaults
          sed -i 's/DB_CONNECTION=.*/DB_CONNECTION=mysql/' .env
          sed -i 's/# DB_HOST=.*/DB_HOST=127.0.0.1/' .env || true
          sed -i 's/DB_HOST=.*/DB_HOST=127.0.0.1/' .env
          sed -i 's/DB_DATABASE=.*/DB_DATABASE=jobazmoon_test/' .env
          sed -i 's/DB_USERNAME=.*/DB_USERNAME=root/' .env
          sed -i 's/DB_PASSWORD=.*/DB_PASSWORD=password/' .env

      - name: Laravel Pint
        run: vendor/bin/pint --test

      - name: PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=1G

      - name: Run migrations
        run: php artisan migrate --force --no-interaction

      # Feature tests that hit Blade views with @vite() need a real Vite manifest.
      # Build here so PHPUnit does not depend on the separate frontend job order.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: PHPUnit
        run: php artisan test

      - name: Generate API Docs
        run: php artisan scribe:generate

      - name: Verify API Docs Output
        run: |
          test -s storage/app/private/scribe/openapi.yaml
          test -s resources/views/scribe/index.blade.php
          test -d public/vendor/scribe


  frontend:
    name: Vite Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint Frontend
        run: npm run lint

      - name: Check Formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run type-check

      - name: Run Frontend Tests
        run: npm run test:unit

      - name: Frontend Coverage
        run: npm run test:unit:coverage

      - name: Upload Coverage
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false

      - name: Build
        run: npm run build

      - name: Check Screenshots Exist
        run: |
          test -f docs/screenshots/home.png || echo "WARNING: Missing screenshots"
          test -f docs/screenshots/exam-list.png || echo "WARNING: Missing exam-list.png"
          test -f docs/screenshots/admin-dashboard.png || echo "WARNING: Missing admin-dashboard.png"

